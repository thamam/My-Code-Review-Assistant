<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Code Review</title>
  <!-- Styling decision: Tailwind is built locally (tailwind.config.js,
       postcss.config.js, src/styles/tailwind.css imported from
       src/index.tsx) via the tailwindcss/postcss/autoprefixer/
       @tailwindcss/typography devDependencies, and Vite's dev/build
       pipeline runs it through PostCSS. The custom gray-750/850/950
       shades and the typography plugin (used by MarkdownRenderer's
       `prose` classes) live in tailwind.config.js. Prism's theme CSS is
       imported from the prismjs package (also in src/index.tsx) rather
       than a CDN link. Neither depends on network access at dev, build,
       or runtime — see tests/boot-smoke.spec.ts, which asserts exactly
       that. Do not reintroduce a CDN <script>/<link> for either. -->
  <style>
    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1f2937;
    }

    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
    }

    /* Code font settings */
    .font-mono {
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
    }

    /* Diagram Navigation Styles (Phase 8) */
    .clickable-ref {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clickable-ref:hover {
      filter: brightness(1.2);
      stroke: #a855f7 !important;
      /* Purple-500 */
      stroke-width: 3px !important;
    }

    /* The invisible hit area for easier clicking */
    .message-hitarea {
      stroke: transparent;
      stroke-width: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body class="bg-gray-900 text-white overflow-hidden h-screen w-screen">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
